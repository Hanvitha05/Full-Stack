<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registrations</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Smart Campus Events</div>
        <div>
            <a th:href="@{/student/events}">Home</a>
            <a th:href="@{/student/my-registrations}">My Registrations</a>
            <a th:href="@{/}">Exit Portal</a>
        </div>
    </nav>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h2>Find My Registrations</h2>
            <p>Enter your student email address to view the events you have registered for.</p>
            
            <form th:action="@{/student/my-registrations}" method="post" style="margin-top: 2rem;">
                <div class="form-group">
                    <label for="email">Student Email</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your email address">
                </div>
                
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary">Find Registrations</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
