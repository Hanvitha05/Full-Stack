<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Events - Welcome</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .landing-container {
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .portal-card {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .portal-card h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .portal-card p {
            color: #666;
            margin-bottom: 3rem;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .portal-btn {
            display: block;
            padding: 2rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            color: white;
        }
        .btn-student {
            background-color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }
        .btn-student:hover {
            background-color: transparent;
            color: var(--primary-color);
            transform: translateY(-5px);
        }
        .btn-admin {
            background-color: var(--dark-color);
            border: 2px solid var(--dark-color);
        }
        .btn-admin:hover {
            background-color: transparent;
            color: var(--dark-color);
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="portal-card">
            <h1>Smart Campus Events</h1>
            <p>Welcome to the campus event management portal. Please select your role to continue.</p>
            
            <div class="options-grid">
                <a th:href="@{/student/events}" class="portal-btn btn-student">
                    I am a Student
                </a>
                <a th:href="@{/admin}" class="portal-btn btn-admin">
                    I am an Admin
                </a>
            </div>
        </div>
    </div>
</body>
</html>
