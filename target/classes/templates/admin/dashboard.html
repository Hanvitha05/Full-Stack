<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Smart Campus Events</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar" style="background-color: var(--secondary-color);">
        <div class="logo" style="color: white;">Admin Dashboard</div>
        <div>
            <a th:href="@{/admin}">Events</a>
            <a th:href="@{/}">Exit Portal</a>
            <a th:href="@{/logout}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Manage Events</h1>
            <a th:href="@{/admin/showNewEventForm}" class="btn btn-success">Add New Event</a>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Date & Time</th>
                        <th>Location</th>
                        <th>Department</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="event : ${listEvents}">
                        <td th:text="${event.title}"></td>
                        <td th:text="${#temporals.format(event.date, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${event.location}"></td>
                        <td th:text="${event.department}"></td>
                        <td th:text="${event.eventType}"></td>
                        <td>
                            <a th:href="@{/admin/showFormForUpdate/{id}(id=${event.id})}" class="btn btn-primary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">Edit</a>
                            <a th:href="@{/admin/deleteEvent/{id}(id=${event.id})}" class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="return confirm('Are you sure you want to delete this event?');">Delete</a>
                            <a th:href="@{/admin/registrations/{id}(id=${event.id})}" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">View Registrations</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${listEvents.empty}" style="text-align: center; padding: 2rem; color: #666;">
                No events found. Add some events to get started.
            </div>
        </div>
    </div>
</body>
</html>
