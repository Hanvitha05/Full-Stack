<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="card">
    <h2>Code Workbench</h2>
    <textarea id="code" rows="10"></textarea>
    <button onclick="run()">Run</button>
</div>

<script>
function run(){
    localStorage.setItem("code", code.value);
    window.location="output.html";
}
</script>

</body>
</html>
