<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registrations - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar" style="background-color: var(--secondary-color);">
        <div class="logo" style="color: white;">Admin Dashboard</div>
        <div>
            <a th:href="@{/admin}">Events</a>
            <a th:href="@{/}">Exit Portal</a>
            <a th:href="@{/logout}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1>Registrations</h1>
                <p>Event: <strong th:text="${event.title}">Event Title</strong></p>
                <p>Total Registered: <span th:text="${totalCount}" class="badge" style="background: var(--primary-color); color: white;">0</span></p>
            </div>
            <a th:href="@{/admin}" class="btn btn-secondary">Back to Events</a>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student Name</th>
                        <th>Student Email</th>
                        <th>Registration Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reg, iterStat : ${registrations}">
                        <td th:text="${iterStat.count}">1</td>
                        <td th:text="${reg.studentName}">Name</td>
                        <td th:text="${reg.studentEmail}">Email</td>
                        <td th:text="${#temporals.format(reg.registrationDate, 'yyyy-MM-dd HH:mm')}">Date</td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${registrations.empty}" style="text-align: center; padding: 2rem; color: #666;">
                No students have registered for this event yet.
            </div>
        </div>
    </div>
</body>
</html>
